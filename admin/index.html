<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HAYCHIC Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css" />
<style>
  body{background:var(--cream);}
  .admin-header{position:sticky;top:0;background:rgba(255,250,245,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:18px 5vw;display:flex;align-items:center;justify-content:space-between;}
  .admin-header .brand{font-size:1.4rem;}
  .admin-wrap{max-width:900px;margin:0 auto;padding:40px 20px 90px;}
  .admin-card{background:white;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--shadow);margin-bottom:30px;}
  .admin-card h2{font-size:1.5rem;margin-top:0;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:.82rem;font-weight:700;margin-bottom:6px;}
  .field input, .field select{width:100%;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:11px 14px;color:var(--brown);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .btn-row{display:flex;gap:10px;margin-top:6px;}
  .listing{display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line);}
  .listing:first-child{border-top:none;}
  .listing .thumb{width:64px;height:64px;border-radius:12px;background:var(--sage) center/cover no-repeat;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.6rem;color:var(--muted);text-align:center;}
  .listing .info{flex:1;}
  .listing .info h4{margin:0 0 2px;font-size:1rem;}
  .listing .info span{font-size:.82rem;color:var(--muted);}
  .listing .actions{display:flex;gap:8px;}
  .listing .actions button{border:1px solid var(--line);background:var(--cream);border-radius:999px;padding:7px 14px;font-size:.78rem;cursor:pointer;}
  .listing .actions button.danger{border-color:#c98a7b;color:#a05f70;}
  #loginScreen{max-width:420px;margin:80px auto;text-align:center;}
  #loginScreen .field{text-align:left;}
  #loginStatus{color:#a05f70;font-size:.85rem;min-height:1.2em;margin-top:10px;}
  .hidden{display:none !important;}
  .spin{opacity:.55;pointer-events:none;}
  #status{position:fixed;bottom:20px;right:20px;background:var(--brown);color:white;padding:14px 20px;border-radius:14px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:99;}
  #status.show{opacity:1;transform:none;}
</style>
</head>
<body>

  <div id="loginScreen">
    <h1 style="font-family:'Playfair Display',serif;">HAYCHIC Admin ♡</h1>
    <p style="color:var(--muted);">Log in to manage listings and photos.</p>
    <div class="field">
      <label>Username</label>
      <input type="text" id="authUsername" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="authPassword" autocomplete="current-password">
    </div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn primary" id="loginBtn" onclick="login()">Log In</button>
    </div>
    <p id="loginStatus"></p>
  </div>

  <div id="adminApp" class="hidden">
    <div class="admin-header">
      <a class="brand" href="../index.html" style="font-family:'Playfair Display',serif;">HAYCHIC <span style="font-size:.6rem;letter-spacing:.2em;">ADMIN</span></a>
      <div style="display:flex;gap:10px;">
        <a class="btn secondary" href="crm.html">CRM &amp; Access →</a>
        <button class="btn secondary" onclick="logout()">Log Out</button>
      </div>
    </div>

    <div class="admin-wrap">
      <div class="admin-card">
        <h2 id="formTitle">Add a New Listing</h2>
        <div class="field">
          <label>Item Name</label>
          <input type="text" id="fName" placeholder="e.g. The Gabriella Bag">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Price</label>
            <input type="text" id="fPrice" placeholder="e.g. $48.00">
          </div>
          <div class="field">
            <label>Status</label>
            <select id="fStatus">
              <option value="in-stock">In Stock</option>
              <option value="preorder">Pre-Order</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Category</label>
          <select id="fCategory">
            <option>Bags</option>
            <option>Clothing</option>
            <option>Shoes</option>
            <option>Beauty</option>
            <option>Accessories</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label>Description (shown on the item's own page)</label>
          <textarea id="fDescription" rows="3" placeholder="A few sentences about this item — fit, material, why you love it..." style="width:100%;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:11px 14px;color:var(--brown);font:inherit;resize:vertical;"></textarea>
        </div>
        <div class="field">
          <label>Photo (optional, but recommended!)</label>
          <input type="file" id="fImage" accept="image/*">
        </div>
        <div class="btn-row">
          <button class="btn primary" id="saveBtn" onclick="saveProduct()">Add Listing</button>
          <button class="btn secondary hidden" id="cancelEditBtn" onclick="cancelEdit()">Cancel</button>
        </div>
      </div>

      <div class="admin-card">
        <h2>Current Listings</h2>
        <div id="listings"><p style="color:var(--muted);">Loading…</p></div>
      </div>
    </div>
  </div>

  <div id="status"></div>

<script>
const ADMIN_API = 'https://haychic-boutique.vercel.app/api/admin';

let session = localStorage.getItem('haychic_admin_session') || '';
let products = [];
let productsSha = null;
let editingId = null;

function showStatus(msg, isError){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.background = isError ? '#a05f70' : 'var(--brown)';
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 3200);
}

async function callAdmin(action, payload){
  const res = await fetch(ADMIN_API, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      ...(session ? { 'Authorization': `Bearer ${session}` } : {})
    },
    body: JSON.stringify({ action, ...payload })
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

async function login(){
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const statusEl = document.getElementById('loginStatus');
  const btn = document.getElementById('loginBtn');
  if(!username || !password){ statusEl.textContent = 'Enter your username and password.'; return; }
  statusEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Logging in…';
  try{
    const data = await callAdmin('login', { username, password });
    session = data.token;
    localStorage.setItem('haychic_admin_session', session);
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminApp').classList.remove('hidden');
    loadListings();
  }catch(err){
    statusEl.textContent = err.message;
  }finally{
    btn.disabled = false;
    btn.textContent = 'Log In';
  }
}

function logout(){
  localStorage.removeItem('haychic_admin_session');
  session = '';
  location.reload();
}

async function loadListings(){
  const wrap = document.getElementById('listings');
  wrap.innerHTML = '<p style="color:var(--muted);">Loading…</p>';
  try{
    const data = await callAdmin('list', {});
    products = data.products;
    productsSha = data.sha;
    renderListings();
  }catch(err){
    if(/session/i.test(err.message)){ logout(); return; }
    wrap.innerHTML = `<p style="color:#a05f70;">${err.message}</p>`;
  }
}

function renderListings(){
  const wrap = document.getElementById('listings');
  if(!products.length){
    wrap.innerHTML = '<p style="color:var(--muted);">No listings yet.</p>';
    return;
  }
  wrap.innerHTML = products.map(p => `
    <div class="listing">
      <div class="thumb" style="${p.image ? `background-image:url('../${p.image}')` : ''}">${p.image ? '' : 'HAYCHIC'}</div>
      <div class="info">
        <h4>${p.name}</h4>
        <span>${p.price} &middot; ${p.category} &middot; ${p.status === 'in-stock' ? 'In Stock' : 'Pre-Order'}</span>
      </div>
      <div class="actions">
        <button onclick="editProduct('${p.id}')">Edit</button>
        <button class="danger" onclick="deleteProduct('${p.id}')">Delete</button>
      </div>
    </div>
  `).join('');
}

function slugify(str){
  return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '-' + Date.now().toString(36);
}

function resizeImage(file, maxW){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const base64 = canvas.toDataURL('image/jpeg', 0.82).split(',')[1];
      resolve(base64);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function saveProduct(){
  const name = document.getElementById('fName').value.trim();
  const price = document.getElementById('fPrice').value.trim();
  const status = document.getElementById('fStatus').value;
  const category = document.getElementById('fCategory').value;
  const description = document.getElementById('fDescription').value.trim();
  const fileInput = document.getElementById('fImage');
  const file = fileInput.files[0];

  if(!name || !price){ showStatus('Please fill in item name and price.', true); return; }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';

  try{
    let entry;
    if(editingId){
      entry = products.find(p => p.id === editingId);
    } else {
      entry = { id: slugify(name), image: '' };
      products.push(entry);
    }
    entry.name = name;
    entry.price = price;
    entry.status = status;
    entry.category = category;
    entry.description = description;

    let image = null;
    if(file){
      showStatus('Uploading photo…');
      const base64 = await resizeImage(file, 1200);
      image = { id: entry.id, base64 };
      entry.image = `assets/products/${entry.id}.jpg`;
    }

    showStatus('Saving listing…');
    const data = await callAdmin('save', {
      products,
      sha: productsSha,
      image,
      message: editingId ? `Update listing: ${name}` : `Add listing: ${name}`
    });
    productsSha = data.sha;

    showStatus('Saved! It will appear on the site in a minute ♡');
    cancelEdit();
    renderListings();
  }catch(err){
    if(/session/i.test(err.message)){ logout(); return; }
    showStatus(err.message || 'Something went wrong.', true);
  }finally{
    saveBtn.disabled = false;
    saveBtn.textContent = editingId ? 'Save Changes' : 'Add Listing';
  }
}

function editProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  editingId = id;
  document.getElementById('formTitle').textContent = 'Edit Listing';
  document.getElementById('fName').value = p.name;
  document.getElementById('fPrice').value = p.price;
  document.getElementById('fStatus').value = p.status;
  document.getElementById('fCategory').value = p.category;
  document.getElementById('fDescription').value = p.description || '';
  document.getElementById('saveBtn').textContent = 'Save Changes';
  document.getElementById('cancelEditBtn').classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
}

function cancelEdit(){
  editingId = null;
  document.getElementById('formTitle').textContent = 'Add a New Listing';
  document.getElementById('fName').value = '';
  document.getElementById('fPrice').value = '';
  document.getElementById('fStatus').value = 'in-stock';
  document.getElementById('fCategory').value = 'Bags';
  document.getElementById('fDescription').value = '';
  document.getElementById('fImage').value = '';
  document.getElementById('saveBtn').textContent = 'Add Listing';
  document.getElementById('cancelEditBtn').classList.add('hidden');
}

async function deleteProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  if(!confirm(`Delete "${p.name}"? This can't be undone.`)) return;
  try{
    const filtered = products.filter(x => x.id !== id);
    const data = await callAdmin('save', {
      products: filtered,
      sha: productsSha,
      message: `Delete listing: ${p.name}`
    });
    products = filtered;
    productsSha = data.sha;
    showStatus('Deleted.');
    renderListings();
  }catch(err){
    if(/session/i.test(err.message)){ logout(); return; }
    showStatus(err.message, true);
  }
}

if(session){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('adminApp').classList.remove('hidden');
  loadListings();
}
</script>
</body>
</html>
